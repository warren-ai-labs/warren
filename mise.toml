min_version = "2025.10.0"

[tools]
go = "1.25.12"
xcbeautify = "latest"
# tmux is needed by the alternative tmux runtime (--runtime tmux);
# ghostline, the default, needs no tmux.
tmux = "latest"

[env]
PROJECT_NAME = "Warren"

[tasks.dev]
description = "Build and run the macOS app"
run = "bash scripts/run-app.sh debug"

[tasks."dev:release"]
description = "Build and run the optimized macOS app"
run = "bash scripts/run-app.sh release"

[tasks.build]
description = "Build the macOS app"
run = "bash scripts/build-app.sh debug"

[tasks."build:headless"]
description = "Build cross-platform headless daemon and CLI"
run = "bash scripts/build-headless.sh .build/headless"

[tasks."test:headless"]
description = "Run headless daemon and CLI tests"
run = "go test -race ./Headless/..."

[tasks.install]
description = "Build the release app, install Warren.app into /Applications, and initialize the local CLI endpoint"
run = "bash scripts/install-app.sh"

[tasks."build:release"]
description = "Release build"
run = "bash scripts/build-app.sh release"

[tasks.test]
description = "Run the macOS end-to-end test"
run = "swift test"

[tasks."test:core"]
run = "swift test --package-path Packages/Domain"

[tasks."ui:observe"]
description = "Observe the desktop semantic tree without screenshots or stealing focus"
run = "bash scripts/observe-ui.sh"

[tasks."accept:ui"]
description = "Verify semantic UI and typed actions without screenshots or stealing focus"
run = "bash scripts/observe-ui.sh"

[tasks.verify]
description = "Build, run all package tests, build app, verify web bundle"
run = "bash scripts/verify.sh"

[tasks."verify:web"]
description = "Launch app and verify HTTP page + WebSocket auth/roster"
run = "bash scripts/verify-web.sh"

[tasks."web:dev"]
description = "Run the Vite development server"
run = "npm --prefix Web run dev"

[tasks."web:build"]
description = "Build the Vite web client into Web/dist"
run = "bash scripts/prepare-web.sh && npm --prefix Web run build"

[tasks."brand:assets"]
description = "Generate responsive macOS and Web brand assets"
run = "bash scripts/generate-brand-assets.sh"

[tasks."relay:run"]
description = "Run the remote Relay control plane"
run = "go run ./RelayService/cmd/warren-relay"

[tasks."relay:dev"]
description = "One command: start local Relay, connect Warren, and open Remote Web"
run = "bash scripts/relay-dev.sh up"

[tasks."relay:connect"]
description = "Connect this Mac to WARREN_RELAY_URL and open Remote Web"
run = "bash scripts/relay-dev.sh up"

[tasks."relay:start"]
description = "Start the local development Relay in the background"
run = "bash scripts/relay-dev.sh start"

[tasks."relay:pair"]
description = "Generate and open another Remote Web pairing URL"
run = "bash scripts/relay-dev.sh pair"

[tasks."relay:status"]
description = "Show local Relay and Host presence"
run = "bash scripts/relay-dev.sh status"

[tasks."relay:logs"]
description = "Follow the local development Relay log"
run = "bash scripts/relay-dev.sh logs"

[tasks."relay:stop"]
description = "Stop the local development Relay"
run = "bash scripts/relay-dev.sh stop"

[tasks."relay:test"]
description = "Run Relay auth, persistence and forwarding tests"
run = "go test -race ./RelayService/..."

[tasks.accept]
description = "Run local phase-one acceptance without screenshots or focus changes"
run = "bash scripts/acceptance-smoke.sh"

[tasks.package]
description = "Build release app and package a zip"
run = "bash scripts/package.sh"

[tasks.clean]
description = "Clean build artifacts"
run = "swift package clean && rm -rf .build Warren.app"
