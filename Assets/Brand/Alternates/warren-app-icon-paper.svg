<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Warren app icon, paper</title>
  <desc id="desc">A near-black single-stroke W with an ember dot on a warm white tile.</desc>
  <defs>
    <radialGradient id="tile" cx="0.3" cy="0" r="1.15" fx="0.3" fy="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f6f2ee"/>
      <stop offset="100%" stop-color="#e9e3dd"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#tile)"/>
  <g transform="scale(10.24)">
    <polyline points="17.5,30.5 31.5,72.5 47.5,43.5 63.5,72.5 76.5,33.5" fill="none" stroke="#1c1917" stroke-width="9.00" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80.77" cy="20.69" r="5.00" fill="#d0653d"/>
  </g>
</svg>
