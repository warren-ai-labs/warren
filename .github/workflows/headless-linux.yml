name: Headless Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux tarball to
        required: false

permissions:
  contents: read

# The Linux binaries are a gate, not an archive. They used to be uploaded as a
# workflow artifact on every branch push, tag push and pull request, and the
# mirrored copy of this file did the same thing again in the public repository,
# which put about 50 MB per run into an account-wide 500 MB artifact quota that
# nothing ever downloaded. The quota filled and every upload, and the gate with
# it, failed for a reason unrelated to the change under review.
#
# The gate now builds and throws the binaries away, and a release gets its
# tarball attached to the GitHub Release itself, where it costs no artifact
# storage. Only the private repository runs the gate on a push, because the
# mirror is a copy of a commit that already passed it; the mirror does run the
# release job, since the release and its assets live there.
jobs:
  build:
    name: Build
    # Only the private repository gates a change: the mirror is a copy of a
    # commit that already passed this job.
    if: github.repository == 'warren-ai-labs/warren-private' && github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux headless binaries
        run: bash scripts/build-headless.sh "$RUNNER_TEMP/warren-headless"

      - name: Package Linux headless binaries
        run: |
          tar -C "$RUNNER_TEMP/warren-headless" -czf "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            warren-headless warren warren-cli warren-ssh-tunnel
          sha256sum "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            > "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz.sha256"

  attach:
    name: Attach to release
    # A release is published after its tag is pushed, so this runs on the
    # release event rather than the tag push. The manual entry point re-attaches
    # the assets of a release whose job failed, which is why it names a tag.
    if: |
      github.repository == 'warren-ai-labs/warren' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux headless binaries
        run: bash scripts/build-headless.sh "$RUNNER_TEMP/warren-headless"

      - name: Package Linux headless binaries
        run: |
          tar -C "$RUNNER_TEMP/warren-headless" -czf "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            warren-headless warren warren-cli warren-ssh-tunnel
          sha256sum "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            > "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz.sha256"

      - name: Upload Linux headless assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
