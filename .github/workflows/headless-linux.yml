name: Headless Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux headless binaries
        run: bash scripts/build-headless.sh "$RUNNER_TEMP/warren-headless"

      - name: Package Linux headless binaries
        run: |
          tar -C "$RUNNER_TEMP/warren-headless" -czf "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            warren-headless warren warren-cli warren-ssh-tunnel
          sha256sum "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz" \
            > "$RUNNER_TEMP/warren-headless-linux-amd64.tar.gz.sha256"

      # A pull request only has to prove the Linux build works; the artifact
      # exists for a release. Uploading one per pull request filled the
      # account's artifact storage until every upload failed, which turned this
      # gate red for a reason that had nothing to do with the change under
      # review.
      - name: Upload Linux headless artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: warren-headless-linux-amd64
          path: |
            ${{ runner.temp }}/warren-headless-linux-amd64.tar.gz
            ${{ runner.temp }}/warren-headless-linux-amd64.tar.gz.sha256
          if-no-files-found: error
